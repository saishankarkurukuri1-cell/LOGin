        <title>Register</title>

    </head>
    <body>
        <div class = "container">
            <h2 class="heading">Create Account</h2>
            <hr>
            <div class="center">
            <form id = "registerForm" class="padding">

                <lable>Name</lable>
                <input type="text" placeholder="Enter your name" id = "name" required class="inp">

                <label>Email</label>
                <input type="text" placeholder="Enter email address" id = "email" required class="inp">
                <br>
                <label>Password</label>
                <input type="password" placeholder="Enter password" id = "password" required class="inp">
                <br>
                <button type="submit" class="Rbutton">Register</button>
            </form> 
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
             <p id="message"></p>
             <script src="js/register.js"></script>
            </div>
        </div>
    </body>
