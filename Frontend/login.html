<html>
    <head>
        <title>LOGin</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
        <h2 class = "heading">Login Page</h2>
        <hr>
        <div class = "center">
        <form action="/auth/login" method="post" class="padding">
            <label for="username">Username:</label>
            <input type="email" id="username" name="username" required class="inp">
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required class="inp">
            <br>
            <button type="submit" class="Rbutton">login</button>
        </form>
        <p>Don't have an account? 
            <a href="register.html">Create account</a>
        </p>
        </div>
        </div>
    </body>
</html>
